# Lõi dự phòng v0.0.1: CI chỉ dùng khi lõi mới không biên dịch được.
[workspace]

[package]
name = "dymith-core-lite"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "dymith_core"
crate-type = ["cdylib"]

[dependencies]
jni = "=0.21.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
