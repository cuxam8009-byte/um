<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trang chủ trình duyệt</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<style>
:root{
  /* Bảng màu Sáng: Đen - Trắng */
  --bg:#FFFFFF;
  --ink:#000000;
  --mute:#737373;
  --surf:#F5F5F5;
  --line:#E5E5E5;
  --acc:#000000;       /* Màu nhấn: Đen */
  --acc-ink:#FFFFFF;   /* Chữ trên nền nhấn: Trắng */
  --sh:0 8px 24px rgba(0,0,0,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    /* Bảng màu Tối: Đen - Trắng */
    --bg:#000000;
    --ink:#FFFFFF;
    --mute:#A3A3A3;
    --surf:#121212;
    --line:#2A2A2A;
    --acc:#FFFFFF;       /* Màu nhấn: Trắng */
    --acc-ink:#000000;   /* Chữ trên nền nhấn: Đen */
    --sh:none;
    color-scheme:dark
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--ink:#FFFFFF;--mute:#A3A3A3;--surf:#121212;--line:#2A2A2A;--acc:#FFFFFF;--acc-ink:#000000;--sh:none;color-scheme:dark
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.stage{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:24px 0 92px;overflow-y:auto;overscroll-behavior:contain}
.top{padding:0 24px;margin-bottom:auto}
.hello{margin:0;color:var(--mute);font-size:15px}
.clock{margin:2px 0 0;font-size:clamp(68px,24vw,104px);font-weight:300;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.date{margin:8px 0 0;color:var(--mute);font-size:15px;text-transform:capitalize}

.recent{display:flex;gap:8px;padding:28px 20px 16px;overflow-x:auto;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent:empty{display:none}
.recent button{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;max-width:70vw;background:var(--surf)}
.recent span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.arc{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 4px;padding:8px 12px 6px;margin-top:0}
.recent:empty+.arc{margin-top:28px}
.arc button{--dy:0px;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;transform:translateY(var(--dy));animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*45ms)}
.arc button:nth-child(4n+1),.arc button:nth-child(4n){--dy:-18px}
.ic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;font-weight:700;font-size:19px;background:var(--surf);color:var(--ink)}
.ic img{width:100%;height:100%;object-fit:contain;border-radius:19px;padding:12px;} /* Padding để icon không bị sát viền */
.arc small{font-size:12px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arc button:active .ic{transform:scale(.94)}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--dy) + 30px))}}

.scrim{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
body.open .scrim{opacity:.86;pointer-events:auto}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.dock>*{max-width:520px;margin-inline:auto}
.panel{display:flex;flex-direction:column;margin-bottom:8px;background:var(--surf);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);max-height:min(60dvh,440px);overflow-y:auto;transform-origin:bottom;animation:pop .14s ease-out}
.panel[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.sug{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column-reverse}
.sug:empty{display:none}
.sug li:first-child .row{font-weight:600}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;border-radius:16px;text-align:left}
.row:active{background:var(--bg)}
.row svg{flex:none;color:var(--mute)}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mute);font-size:13px}
.chips{display:flex;gap:8px;padding:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.sug:not(:empty)+.chips{border-top:1px solid var(--line)}
.chip{flex:none;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--bg)}
.chip[aria-checked="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.chip.ghost{color:var(--mute);border-style:dashed}

.bar{display:flex;align-items:center;gap:8px;height:58px;padding:6px;background:var(--surf);border:1px solid var(--line);border-radius:29px;box-shadow:var(--sh)}
.eng{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg);font-weight:700;color:var(--ink)}
#q{flex:1;min-width:0;height:44px;border:0;background:none;font-size:16px;outline:0;color:var(--ink)}
#q::placeholder{color:var(--mute)}
.bar:focus-within{border-color:var(--acc)}
.go{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--mute);transition:background .12s,color .12s}
.go.on{background:var(--acc);color:var(--acc-ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
  <header class="top">
    <p class="hello" id="hello"></p>
    <h1 class="clock" id="clock">00:00</h1>
    <p class="date" id="date"></p>
  </header>
  <section class="recent" id="recent" aria-label="Tìm gần đây"></section>
  <section class="arc" id="arc" aria-label="Lối tắt"></section>
</main>
<div class="scrim" id="scrim"></div>
<div class="dock" id="dock">
  <div class="panel" id="panel" hidden>
    <ul class="sug" id="sug"></ul>
    <div class="chips" id="chips" role="radiogroup" aria-label="Công cụ tìm kiếm"></div>
  </div>
  <div class="bar">
    <button class="eng" id="engBtn" aria-label="Đổi công cụ tìm kiếm"></button>
    <input id="q" type="text" placeholder="Tìm kiếm hoặc nhập địa chỉ" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Tìm kiếm hoặc nhập địa chỉ">
    <button class="go" id="goBtn" aria-label="Đi"></button>
  </div>
</div>
<script>
(function(){
var $=function(s){return document.getElementById(s)};
// Đã cập nhật mảng SITES dùng Google Favicon API
var SITES=[
  ["YouTube","youtube.com","https://www.google.com/s2/favicons?domain=youtube.com&sz=128"],
  ["Facebook","facebook.com","https://www.google.com/s2/favicons?domain=facebook.com&sz=128"],
  ["Zalo","chat.zalo.me","https://www.google.com/s2/favicons?domain=zalo.me&sz=128"],
  ["Shopee","shopee.vn","https://www.google.com/s2/favicons?domain=shopee.vn&sz=128"],
  ["VnExpress","vnexpress.net","https://www.google.com/s2/favicons?domain=vnexpress.net&sz=128"],
  ["Gmail","mail.google.com","https://www.google.com/s2/favicons?domain=mail.google.com&sz=128"],
  ["GitHub","github.com","https://www.google.com/s2/favicons?domain=github.com&sz=128"],
  ["Wikipedia","vi.wikipedia.org","https://www.google.com/s2/favicons?domain=wikipedia.org&sz=128"]
];
var ENG=[["Google","https://www.google.com/search?q="],["DuckDuckGo","https://duckduckgo.com/?q="],["Bing","https://www.bing.com/search?q="],["Cốc Cốc","https://coccoc.com/search?query="]];
var TN={auto:"Tự động",light:"Sáng",dark:"Tối"};
var svg=function(p){return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'};
var IC={go:svg('<path d="M5 12h14M13 6l6 6-6 6"/>'),search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),globe:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')};

var ls={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// Đã set mặc định engine là 0 (Google)
var ei=ls.get("eng",0);if(!ENG[ei])ei=0; 
var hist=ls.get("hist",[]);if(!Array.isArray(hist))hist=[];
var theme=ls.get("theme","auto");if(!TN[theme])theme="auto";

var q=$("q"),panel=$("panel"),sug=$("sug"),chips=$("chips"),recent=$("recent"),goBtn=$("goBtn"),engBtn=$("engBtn");
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};

// [Dymith] Cầu nối tới vỏ native (Kotlin) và lõi Rust. Đối tượng window.Browser chỉ được tiêm vào
// đúng origin của trang này (WebViewCompat.addWebMessageListener), website bên ngoài không có.
var NB=(window.Browser&&typeof window.Browser.postMessage==="function")?window.Browser:null;
function nbSend(o){if(!NB)return false;try{NB.postMessage(JSON.stringify(o));return true}catch(e){return false}}
var sugSeq=0,nativeSug=[];
function hostOf(u){return String(u).replace(/^https?:\/\//i,"").split("/")[0]}
if(NB){NB.onmessage=function(ev){
  try{
    var m=JSON.parse(ev.data);
    if(m&&m.op==="suggest"&&m.id===sugSeq){nativeSug=Array.isArray(m.items)?m.items:[];renderPanel()}
  }catch(e){}
}}
function askSuggest(){
  var s=q.value.trim();
  if(!s||!NB){nativeSug=[];return}
  sugSeq++;nbSend({op:"suggest",id:sugSeq,q:s});
}
function syncEngine(){nbSend({op:"engine",tpl:ENG[ei][1]+"%s"})}

function isUrl(s){return !/\s/.test(s)&&(/^https?:\/\/\S+$/i.test(s)||/^localhost(:\d+)?(\/.*)?$/i.test(s)||/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(s))}
function openUrl(u){
  // [Dymith] Điều hướng do native thực hiện (WebView không mở được cửa sổ mới bằng window.open).
  if(!nbSend({op:"open",url:u}))window.open(u,"_blank","noopener");
}
function go(raw){
  var s=(raw||"").trim();if(!s)return;
  var u;
  if(isUrl(s)){u=/^https?:/i.test(s)?s:"https://"+s}
  else{
    u=ENG[ei][1]+encodeURIComponent(s);
    hist=[s].concat(hist.filter(function(h){return h.toLowerCase()!==s.toLowerCase()})).slice(0,8);
    ls.set("hist",hist);
  }
  q.value="";q.blur();nativeSug=[];renderAll();
  // [Dymith] Ưu tiên để lõi Rust phân giải (đúng với localhost, địa chỉ IP, cổng...). u chỉ là phương án dự phòng.
  if(!nbSend({op:"go",text:s,tpl:ENG[ei][1]+"%s"}))openUrl(u);
}

function row(kind,text,attr,sub){return '<li><button class="row" '+attr+'>'+IC[kind]+'<span>'+esc(text)+'</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</button></li>'}
function renderPanel(){
  var s=q.value.trim(),l=s.toLowerCase(),r=[];
  if(s){
    r.push(isUrl(s)?row("globe","Mở "+s,'data-q="'+esc(s)+'"'):row("search","Tìm “"+s+"” trên "+ENG[ei][0],'data-q="'+esc(s)+'"'));
    SITES.filter(function(x){return x[0].toLowerCase().indexOf(l)>-1||x[1].indexOf(l)>-1}).slice(0,3).forEach(function(x){r.push(row("globe",x[0],'data-url="https://'+x[1]+'"',x[1]))});
    hist.filter(function(h){var k=h.toLowerCase();return k.indexOf(l)>-1&&k!==l}).slice(0,3).forEach(function(h){r.push(row("clock",h,'data-q="'+esc(h)+'"'))});
    // [Dymith] Gợi ý từ lịch sử duyệt web do lõi Rust trả về (khớp không dấu tiếng Việt).
    nativeSug.slice(0,3).forEach(function(x){if(x&&x.u)r.push(row("globe",x.t||hostOf(x.u),'data-url="'+esc(x.u)+'"',hostOf(x.u)))});
  }else{
    hist.slice(0,5).forEach(function(h){r.push(row("clock",h,'data-q="'+esc(h)+'"'))});
  }
  sug.innerHTML=r.join("");
  chips.innerHTML=ENG.map(function(e,i){return '<button class="chip" role="radio" aria-checked="'+(i===ei)+'" data-eng="'+i+'">'+e[0]+'</button>'}).join("")
    +'<button class="chip ghost" data-act="theme">Giao diện: '+TN[theme]+'</button>'
    +(hist.length?'<button class="chip ghost" data-act="clear">Xóa lịch sử</button>':'');
}
function renderStage(){
  // Cập nhật renderStage dùng thẻ img thay cho chữ cái
  $("arc").innerHTML=SITES.map(function(x,i){
    return '<button data-url="https://'+x[1]+'" style="--i:'+i+'"><span class="ic"><img src="'+x[2]+'" alt="'+x[0]+'" loading="lazy" decoding="async" onerror="this.src=\'data:image/svg+xml;utf8,<svg xmlns=\\\'http://www.w3.org/2000/svg\\\' viewBox=\\\'0 0 24 24\\\' fill=\\\'none\\\' stroke=\\\'gray\\\' stroke-width=\\\'2\\\'><circle cx=\\\'12\\\' cy=\\\'12\\\' r=\\\'9\\\'/><path d=\\\'M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18\\\'/></svg>\'"></span><small>'+x[0]+'</small></button>'
  }).join("");
  recent.innerHTML=hist.slice(0,4).map(function(h){return '<button data-q="'+esc(h)+'">'+IC.clock+'<span>'+esc(h)+'</span></button>'}).join("");
}
function syncBar(){
  engBtn.textContent=ENG[ei][0].charAt(0);
  goBtn.innerHTML=IC.go;
  goBtn.classList.toggle("on",!!q.value.trim());
}
function renderAll(){renderStage();renderPanel();syncBar()}
function applyTheme(){var r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);nbSend({op:"theme",mode:theme})}

function setOpen(o){document.body.classList.toggle("open",o);panel.hidden=!o;if(o)renderPanel()}
q.addEventListener("focus",function(){setOpen(true)});
q.addEventListener("blur",function(){setOpen(false)});
q.addEventListener("input",function(){askSuggest();renderPanel();syncBar()});
q.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();go(q.value)}else if(e.key==="Escape"){q.blur()}});
$("scrim").addEventListener("click",function(){q.blur()});
$("dock").addEventListener("mousedown",function(e){if(e.target!==q)e.preventDefault()});
goBtn.addEventListener("click",function(){if(q.value.trim())go(q.value);else q.focus()});
engBtn.addEventListener("click",function(){ei=(ei+1)%ENG.length;ls.set("eng",ei);syncEngine();if(document.activeElement!==q)q.focus();renderPanel();syncBar()});

function pick(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.url)openUrl(d.url);else if(d.q)go(d.q);
  else if(d.eng!==undefined){ei=+d.eng;ls.set("eng",ei);syncEngine();renderPanel();syncBar()}
  else if(d.act==="theme"){theme=theme==="auto"?"light":theme==="light"?"dark":"auto";ls.set("theme",theme);applyTheme();renderPanel()}
  else if(d.act==="clear"){hist=[];ls.set("hist",hist);renderAll()}
}
panel.addEventListener("click",pick);
$("arc").addEventListener("click",pick);
recent.addEventListener("click",pick);

var last="",timer;
function tick(){
  var d=new Date(),h=d.getHours(),t=("0"+h).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  if(t===last)return;last=t;
  $("clock").textContent=t;
  $("hello").textContent=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";
  $("date").textContent=d.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});
}
function start(){tick();clearInterval(timer);timer=setInterval(tick,20000)}
document.addEventListener("visibilitychange",function(){if(document.hidden)clearInterval(timer);else start()});

applyTheme();syncEngine();renderAll();start();
})();
</script>
</body>
</html>
